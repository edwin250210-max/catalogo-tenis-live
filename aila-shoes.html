<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111111">
  <title>AILA SHOES | Catálogo</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #f4f4f4; color: #111; font-family: Arial, sans-serif; }
    header { position: sticky; top: 0; z-index: 2; padding: 16px; background: #111; color: #fff; box-shadow: 0 3px 10px #0003; }
    h1 { margin: 0 0 12px; text-align: center; font-size: 24px; }
    .filtros { max-width: 1100px; margin: auto; }
    select { width: 100%; min-height: 58px; padding: 12px; border: 3px solid #ffe600; border-radius: 12px; background: white; font-size: 17px; font-weight: bold; }
    #estado { max-width: 1100px; margin: 16px auto 0; padding: 0 12px; font-weight: bold; }
    #catalogo { max-width: 1100px; margin: 14px auto; padding: 0 12px 40px; display: grid; grid-template-columns: repeat(4,minmax(0,1fr)); gap: 14px; }
    .producto { min-width: 0; overflow: hidden; border-radius: 12px; background: white; box-shadow: 0 2px 10px #0002; }
    .producto img { display: block; width: 100%; aspect-ratio: 1; object-fit: cover; background: #eee; cursor: zoom-in; }
    .contenido { padding: 12px; }
    .nombre { margin: 0 0 10px; font-size: 16px; line-height: 1.25; overflow-wrap: anywhere; }
    .tallas { display: flex; flex-wrap: wrap; gap: 6px; }
    .talla { min-width: 48px; padding: 7px 6px; border-radius: 7px; background: #111; color: #fff; text-align: center; font-size: 13px; font-weight: bold; }
    .talla small { font-size: 10px; }
    .sin-resultados { grid-column: 1/-1; padding: 48px 15px; text-align: center; font-size: 19px; }
    .visor { position: fixed; inset: 0; z-index: 5; display: none; align-items: center; justify-content: center; padding: 18px; background: #000e; cursor: zoom-out; }
    .visor.abierto { display: flex; }
    .visor img { max-width: 96vw; max-height: 92vh; object-fit: contain; border-radius: 10px; }
    @media (max-width: 800px) { #catalogo { grid-template-columns: repeat(3,minmax(0,1fr)); gap: 10px; } }
    @media (max-width: 560px) { #catalogo { grid-template-columns: repeat(2,minmax(0,1fr)); gap: 9px; } .contenido { padding: 9px; } .nombre { font-size: 14px; } }
  </style>
</head>
<body>
  <header>
    <h1>AILA SHOES</h1>
    <div class="filtros">
      <select id="talla" aria-label="Filtrar por talla">
        <option value="">Todas las tallas</option>
        <option>22</option><option>22.5</option><option>23</option><option>23.5</option>
        <option>24</option><option>24.5</option><option>25</option><option>25.5</option>
        <option>26</option><option>26.5</option><option>27</option><option>27.5</option>
        <option>28</option><option>28.5</option>
      </select>
    </div>
  </header>
  <div id="estado">Cargando catálogo...</div>
  <main id="catalogo"></main>
  <div id="visor" class="visor" aria-hidden="true"><img id="imagenGrande" alt=""></div>

  <script>
    const API = "https://catalogo-backend-publico.onrender.com/api/catalogo?location=aila-shoes";
    const catalogo = document.getElementById("catalogo");
    const estado = document.getElementById("estado");
    const talla = document.getElementById("talla");
    const visor = document.getElementById("visor");
    const imagenGrande = document.getElementById("imagenGrande");
    let productos = [];

    function renderizar() {
      const seleccion = talla.value;
      const visibles = productos.map(producto => ({
        ...producto,
        tallas: producto.tallas.filter(item => !seleccion || String(item.talla) === seleccion)
      })).filter(producto => producto.tallas.length);

      estado.textContent = `${visibles.length} modelos disponibles`;
      if (!visibles.length) {
        catalogo.innerHTML = '<div class="sin-resultados">No hay modelos disponibles en esa talla.</div>';
        return;
      }

      catalogo.innerHTML = visibles.map(producto => `
        <article class="producto">
          <img class="foto" src="${producto.imagen || ""}" alt="${producto.imagen_alt || producto.nombre || "Tenis"}" loading="lazy" onerror="this.src='https://placehold.co/600x600?text=Sin+imagen'">
          <div class="contenido">
            <h2 class="nombre">${producto.nombre || "Producto sin nombre"}</h2>
            <div class="tallas">${producto.tallas.map(item => `
              <span class="talla">${item.talla}<br><small>${item.existencias} disponibles</small></span>
            `).join("")}</div>
          </div>
        </article>
      `).join("");
    }

    async function cargarCatalogo() {
      try {
        const respuesta = await fetch(API, {cache: "no-store"});
        if (!respuesta.ok) throw new Error(`Error ${respuesta.status}`);
        const datos = await respuesta.json();
        productos = Array.isArray(datos.productos) ? datos.productos : [];
        renderizar();
      } catch (error) {
        console.error(error);
        estado.textContent = "No se pudo cargar el catálogo.";
        catalogo.innerHTML = '<div class="sin-resultados">Revisa que el servidor siga activo.</div>';
      }
    }

    talla.addEventListener("change", renderizar);
    catalogo.addEventListener("click", event => {
      const foto = event.target.closest(".foto");
      if (!foto) return;
      imagenGrande.src = foto.src;
      imagenGrande.alt = foto.alt;
      visor.classList.add("abierto");
      visor.setAttribute("aria-hidden", "false");
    });
    visor.addEventListener("click", () => {
      visor.classList.remove("abierto");
      visor.setAttribute("aria-hidden", "true");
      imagenGrande.src = "";
    });
    document.addEventListener("keydown", event => {
      if (event.key === "Escape") visor.click();
    });
    cargarCatalogo();
  </script>
</body>
</html>
